<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Aula 1 · De onde vem o dado? Uma API, duas partes que precisam conversar">
<title>Aula 1 · De onde vem o dado? Uma API, duas partes que precisam conversar</title>
