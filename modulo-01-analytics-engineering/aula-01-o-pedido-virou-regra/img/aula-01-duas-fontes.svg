<text font-size="15" fill="#1e1e1e" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="150" y="130.5">API · pedidos</tspan><tspan x="150" y="150.0">+ clientes</tspan><tspan x="150" y="169.5">(sem status)</tspan></text>
<polygon points="450.0,86.0 578.0,150.0 450.0,214.0 322.0,150.0" fill="#f1f3f5" stroke="#495057" stroke-width="2" stroke-linejoin="round"/>
<text font-size="15" fill="#1e1e1e" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="450" y="130.5">order_id</tspan><tspan x="450" y="150.0">=</tspan><tspan x="450" y="169.5">order_id</tspan></text>
