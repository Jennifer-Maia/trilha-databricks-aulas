<text font-size="15" fill="#1e1e1e" font-weight="normal" text-anchor="middle" dominant-baseline="middle"><tspan x="150" y="320.5">Contrato, pergunta 3:</tspan><tspan x="150" y="340.0">mesmo event_id =</tspan><tspan x="150" y="359.5">mesmo evento</tspan></text>
